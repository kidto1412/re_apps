<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mobile POS - Reconstructed API Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #header {
      background-color: #1a1a2e;
      color: #fff;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="header">Mobile POS API Contract Documentation (OpenAPI 3.0)</div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      fetch('api_specification.json')
        .then(res => res.json())
        .then(spec => {
          SwaggerUIBundle({
            spec: spec,
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
              SwaggerUIBundle.presets.apis,
              SwaggerUIBundle.SwaggerUIStandalonePreset
            ]
          });
        })
        .catch(err => {
          console.error("Failed to load api_specification.json:", err);
          document.getElementById('swagger-ui').innerText = "Error loading api_specification.json. Ensure the file is served over an HTTP server.";
        });
    };
  </script>
</body>
</html>
